[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-local-harness"
version = "0.6.1"
description = "Local development orchestration, explicit recovery and optional Codex JSONL adapter"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
readme = "harness/README.ko.md"
dependencies = []

[project.scripts]
ai-dev-harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]
