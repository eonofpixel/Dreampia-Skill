  <circle cx="1020" cy="340" r="200" fill="#06b6d4" opacity="0.08"/>

  <!-- Top Border Accent -->
  <rect x="60" y="0" width="1080" height="4" fill="url(#accentGrad)"/>

  <!-- Top Status Pills -->
  <g transform="translate(60, 38)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">
