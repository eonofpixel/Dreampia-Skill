      <text x="39" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#34d399">01</text>
      <text x="18" y="68" font-size="16" font-weight="700" fill="#f1f5f9">Hero &amp; RPG Guild Party</text>
      <text x="18" y="94" font-size="12.5" fill="#94a3b8">Hero · GuildMaster · Sage</text>
      <text x="18" y="114" font-size="12.5" fill="#94a3b8">Archmage · Paladin · Knight</text>
      <text x="18" y="134" font-size="12.5" fill="#94a3b8">Bard · Archer · Alchemist</text>
      <text x="18" y="158" font-size="12" font-weight="600" fill="#10b981">Inquisitor · Cleric · Guardian</text>
