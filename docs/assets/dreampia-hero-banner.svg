    <circle cx="18" cy="14" r="4" fill="#34d399"/>
    <text x="82" y="18" text-anchor="middle" fill="#a7f3d0">v1.0.0 RELEASE</text>

    <rect x="164" y="0" width="195" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="261.5" y="18" text-anchor="middle" fill="#94a3b8">Python 3.9+ Zero-Dep</text>

    <rect x="373" y="0" width="215" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="480.5" y="18" text-anchor="middle" fill="#94a3b8">Windows · macOS · Linux</text>

    <rect x="602" y="0" width="165" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <text x="684.5" y="18" text-anchor="middle" fill="#67e8f9">Apache-2.0 License</text>

    <rect x="781" y="0" width="299" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="930.5" y="18" text-anchor="middle" fill="#6ee7b7">sharpen · ulw · loop · climb · re · sdd</text>
  </g>

  <!-- Main Title & Subtitle -->
  <g transform="translate(60, 118)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      DREAMPIA<tspan fill="#10b981">-SKILL</tspan>
    </text>
    <text x="375" y="-4" font-size="21" font-weight="600" fill="#38bdf8">
      Hero · Quest · RPG Guild Party AI Harness
    </text>
    <text x="0" y="38" font-size="15.5" fill="#cbd5e1" font-weight="400">
