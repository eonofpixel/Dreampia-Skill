      <rect x="18" y="18" width="42" height="26" rx="6" fill="#083344"/>
      <text x="39" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#22d3ee">02</text>
      <text x="18" y="68" font-size="16" font-weight="700" fill="#f1f5f9">Quest Journal (SDD+TDD)</text>
      <text x="18" y="94" font-size="12.5" fill="#94a3b8">PRD-R* &#8594; API/UX &#8594; TASK &#8594; TEST</text>
      <text x="18" y="114" font-size="12.5" fill="#94a3b8">C / B / A / S Quest Ranks</text>
      <text x="18" y="134" font-size="12.5" fill="#94a3b8">Orphan &amp; Spec Drift Guard</text>
      <text x="18" y="158" font-size="12" font-weight="600" fill="#22d3ee">SHA-256 Spec Ledger Verified</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(550, 0)">
      <rect width="255" height="175" rx="14" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6"/>
      <rect x="18" y="18" width="42" height="26" rx="6" fill="#1e3a8a"/>
      <text x="39" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#60a5fa">03</text>
      <text x="18" y="68" font-size="16" font-weight="700" fill="#f1f5f9">Alchemist Cleanroom RE</text>
      <text x="18" y="94" font-size="12.5" fill="#94a3b8">PE · ELF · Mach-O · WASM · ASAR</text>
      <text x="18" y="114" font-size="12.5" fill="#94a3b8">3-Zone Contamination Guard</text>
      <text x="18" y="134" font-size="12.5" fill="#94a3b8">Black-Box Golden I/O Parity</text>
      <text x="18" y="158" font-size="12" font-weight="600" fill="#60a5fa">100% Obligation Coverage</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(825, 0)">
      <rect width="255" height="175" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <rect x="18" y="18" width="42" height="26" rx="6" fill="#3b0764"/>
      <text x="39" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#c084fc">04</text>
      <text x="18" y="68" font-size="16" font-weight="700" fill="#f1f5f9">Inquisitor &amp; Cleric Gate</text>
      <text x="18" y="94" font-size="12.5" fill="#94a3b8">Blocks Hollow TDD (assert True)</text>
      <text x="18" y="114" font-size="12.5" fill="#94a3b8">Forbids any &amp; Missing Return</text>
      <text x="18" y="134" font-size="12.5" fill="#94a3b8">Anti-Amnesia Context Pack</text>
      <text x="18" y="158" font-size="12" font-weight="600" fill="#c084fc">5-Stage Boss Gate Verdict</text>
